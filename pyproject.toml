[project]
name = "anp-fetcher"
version = "2.11.1"
description = "A commandline utility to download ANP (Agência Nacional do Petróleo) statistical data"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["anp", "petroleo", "combustiveis", "energia", "brazil", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.22.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "quantilica-analytics>=0.5.0",
    "fastexcel>=0.12.0",
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/Quantilica/anp-fetcher"
Repository = "https://github.com/Quantilica/anp-fetcher"
Issues = "https://github.com/Quantilica/anp-fetcher/issues"

[project.scripts]
anp-fetcher = "anp_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
anp = "anp_fetcher.plugin:app"

[project.entry-points."quantilica.lake"]
anp = "anp_fetcher.lake:converter"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1",
    # Os testes geram planilhas com polars.write_excel.
    "xlsxwriter>=3.2",
    # Só para os testes: tests/test_lake.py exercita o comando convert do plugin Typer,
    # que depende do host (quantilica-cli). Não são dependências do pacote.
    "quantilica-cli>=0.19.0",
    "quantilica-core[docs]>=0.19.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

# Índices: o uv procura em ordem e para no primeiro que tem o pacote
# (index-strategy padrão first-index). O PyPI vem antes, então o índice
# Quantilica (GitHub Pages, que responde 503 intermitente a pacote que não
# hospeda) só é consultado para o que não está no PyPI (quantilica-analytics).
# Sem [tool.uv.sources]: no workspace do monorepo quantilica-analytics é membro
# e uma fonte de índice aqui quebraria o `uv run` da raiz.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "quantilica"
url = "https://index.quantilica.com/simple/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "src/anp_fetcher/catalog_fase_exploracao.py" = ["E501"] }

[tool.hatch.build.targets.wheel]
packages = ["src/anp_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]

[tool.coverage.run]
source = ["anp_fetcher"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
