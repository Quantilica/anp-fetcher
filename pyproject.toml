[project]
name = "anp-fetcher"
version = "2.1.2"
description = "A commandline utility to download ANP (Agência Nacional do Petróleo) statistical data"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["anp", "petroleo", "combustiveis", "energia", "brazil", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.15.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "quantilica-analytics>=0.5.0",
    "fastexcel>=0.12.0",
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/Quantilica/anp-fetcher"
Repository = "https://github.com/Quantilica/anp-fetcher"
Issues = "https://github.com/Quantilica/anp-fetcher/issues"

[project.scripts]
anp-fetcher = "anp_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
anp = "anp_fetcher.plugin:app"

[project.entry-points."quantilica.lake"]
anp = "anp_fetcher.lake:converter"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1",
    # Os testes geram planilhas com polars.write_excel.
    "xlsxwriter>=3.2",
    # Só para os testes: tests/test_lake.py exercita o comando convert do plugin Typer,
    # que depende do host (quantilica-cli). Não são dependências do pacote.
    "quantilica-cli>=0.13.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "src/anp_fetcher/catalog_fase_exploracao.py" = ["E501"] }

[tool.hatch.build.targets.wheel]
packages = ["src/anp_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
